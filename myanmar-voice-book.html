<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ミャンマー語 音声帳">
<title>ミャンマー語 音声帳(支援計画書)</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1c2422;--sub:#5d6b66;--line:#dfe5e1;--accent:#0f766e;--accent-ink:#fff;--soft:#e2f1ee;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2320;--ink:#e8efec;--sub:#9aaba5;--line:#2c3834;--accent:#2dd4bf;--accent-ink:#06201c;--soft:#173430;--warn:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.5}
.my{font-family:"Noto Sans Myanmar","Myanmar Text","Padauk","Myanmar3",system-ui,sans-serif;line-height:1.9}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:17px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center}
input[type=search]{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
select{font-size:15px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:10px 12px calc(90px + env(safe-area-inset-bottom))}
.sec{margin:18px 0 8px}
.sec h2{font-size:15px;margin:0;color:var(--sub);font-weight:600}
.sec .my{font-size:15px;color:var(--ink)}
.sec .secbar{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;transition:background .15s,border-color .15s}
.card.playing{background:var(--soft);border-color:var(--accent)}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.id{font-weight:700;background:var(--soft);color:var(--ink);padding:1px 8px;border-radius:999px}
.ja{font-size:14px;color:var(--sub);margin:6px 0 4px}
.myt{font-size:23px;margin:2px 0 10px;word-break:break-word}
.kana{font-size:15px;line-height:1.7;margin:0 0 12px;padding:8px 10px;border-radius:10px;background:var(--soft);color:var(--ink);font-weight:400}
.kana .seg{margin-right:.9em}
.kana .sy{white-space:nowrap}
.nokana .kana{display:none}
#frameNote{display:none;margin:0 0 10px;padding:10px 12px;border-radius:10px;background:#fef3c7;color:#78350f;font-size:13px;line-height:1.6}
@media (prefers-color-scheme:dark){#frameNote{background:#3a2f0b;color:#fde68a}}
.btns{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.play{flex:1;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700}
.play:active{transform:scale(.99)}
.star{min-width:48px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--sub);font-size:22px}
.star[aria-pressed=true]{color:#f59e0b;border-color:#f59e0b}
.mini{font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.empty{color:var(--sub);text-align:center;padding:40px 0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:656px;margin:0 auto;background:#1f2937;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;display:none;z-index:9}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;z-index:8}
#bar .wrap{display:flex;gap:10px;align-items:center}
#bar .now{flex:1;min-width:0;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--warn);color:#fff;font-weight:700;font-size:15px}
.foot{font-size:12px;color:var(--sub);margin:24px 0 0}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>ミャンマー語 音声帳(支援計画書)</h1>
  <div class="row">
    <input id="q" type="search" placeholder="探す(日本語・番号)" aria-label="検索">
    <button id="kanaBtn" class="tab" aria-pressed="true" style="flex:none">読み仮名</button>
    <select id="speed" aria-label="再生速度">
      <option value="0.7">ゆっくり</option>
      <option value="0.85" selected>やや遅め</option>
      <option value="1">ふつう</option>
    </select>
  </div>
  <div class="tabs" id="tabs" role="toolbar" aria-label="項目の絞り込み"></div>
</div></header>
<main><div class="wrap"><div id="frameNote">いまの画面(アプリ内のプレビュー)では、外部の音声が止められて音が出ないことがあります。音が出ないときは、このファイルをGitHubに置いて、Safariで開いてください。</div></div><div class="wrap" id="list"></div>
<div class="wrap foot">音声はGoogle翻訳の読み上げ(非公式の方法)を使います。長い文は区切りごとに順に再生します。端末やネット環境によっては音が出ないことがあります。</div></main>
<div id="bar"><div class="wrap"><div class="now" id="now"></div><button id="stopAll">■ 止める</button></div></div>
<div id="toast" role="status"></div>

var token=0,curAudio=null,curCard=null,player=new Audio();
function toast(m){var t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},4000)}
function ttsText(s){return s.replace(/[()（）~]/g," ").replace(/\s+/g," ").trim()}
function chunks(s){
  var out=[],parts=ttsText(s).split(/[၊။／\/]/);
  parts.forEach(function(p){
    p=p.trim();if(!p)return;
    while(p.length>150){
      var cut=p.lastIndexOf(" ",150);if(cut<40)cut=150;
      out.push(p.slice(0,cut).trim());p=p.slice(cut).trim();
    }
    if(p)out.push(p);
  });
  return out;
}
var CLIENTS=["tw-ob","gtx"];
function urlFor(t,c){return "https://translate.google.com/translate_tts?ie=UTF-8&client="+c+"&tl=my&q="+encodeURIComponent(t)}
function tryOne(t,rate,c){
  return new Promise(function(res,rej){
    var a=player;curAudio=a;
    a.onended=function(){res()};
    a.onerror=function(){rej(new Error("audio"))};
    a.src=urlFor(t,c);
    try{a.playbackRate=rate;a.preservesPitch=true}catch(e){}
    var p=a.play();if(p&&p.catch)p.catch(function(e){rej(e)});
  });
}
async function playChunkGoogle(t,rate){
  var last;
  for(var i=0;i<CLIENTS.length;i++){
    try{ await tryOne(t,rate,CLIENTS[i]); return; }catch(e){ last=e; }
  }
  throw last;
}
function pickVoice(){
  var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  for(var i=0;i<v.length;i++){if(/^(my|bur)/i.test(v[i].lang))return v[i]}
  return null;
}
function playChunkSpeech(t,rate){
  return new Promise(function(res,rej){
    if(!window.speechSynthesis){rej(new Error("nospeech"));return}
    var v=pickVoice();if(!v){rej(new Error("novoice"));return}
    var u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=rate;
    u.onend=function(){res()};u.onerror=function(){rej(new Error("speech"))};
    speechSynthesis.cancel();speechSynthesis.speak(u);
  });
}
function stopAudio(){
  token++;
  if(curAudio){try{curAudio.onended=null;curAudio.onerror=null;curAudio.pause();curAudio.removeAttribute("src");curAudio.load()}catch(e){}curAudio=null}
  if(window.speechSynthesis){try{speechSynthesis.cancel()}catch(e){}}
  if(curCard){curCard.classList.remove("playing");curCard=null}
  $("#bar").style.display="none";
}
async function speak(text,card,label){
  stopAudio();
  var my=++token,rate=parseFloat($("#speed").value)||0.85,list=chunks(text);
  if(card){card.classList.add("playing");curCard=card}
  $("#now").textContent="再生中:"+(label||"");$("#bar").style.display="block";
  var mode="google";
  for(var i=0;i<list.length;i++){
    if(my!==token)return false;
    try{
      if(mode==="google")await playChunkGoogle(list[i],rate);
      else await playChunkSpeech(list[i],rate);
    }catch(e){
      if(my!==token)return false;
      if(mode==="google"){
        mode="speech";
        try{await playChunkSpeech(list[i],rate)}
        catch(e2){
          if(my===token){toast("音声を再生できませんでした。ネット接続を確認して、もう一度押してください。");stopAudio()}
          return false;
        }
      }else{ if(my===token){toast("音声を出せませんでした。");stopAudio()} return false;}
    }
  }
  if(my===token){stopAudio();return true}
  return false;
}

/* ---------- 画面 ---------- */
function buildTabs(){
  var t=$("#tabs");t.innerHTML="";
  function add(key,label){
    var b=el("button","tab",label);b.setAttribute("aria-pressed",String(state.tab===key));
    b.onclick=function(){stopAudio();state.tab=key;buildTabs();render();window.scrollTo(0,0)};
    t.appendChild(b);
  }
  add("all","すべて");add("star","★ 復習");
  DATA.forEach(function(s,i){if(LABELS[i])add(String(i),LABELS[i])});
}
function matches(it){
  if(state.tab==="star"&&!state.stars[it.id])return false;
  var q=state.q.trim().toLowerCase();
  if(!q)return true;
  return (it.id+" "+it.ja+" "+it.my).toLowerCase().indexOf(q)>=0;
}
function kanaEl(kn){
  var d=el("div","kana");
  (kn||"").split("　").forEach(function(sg){
    if(!sg)return;
    var w=el("span","seg"),parts=sg.split("・");
    parts.forEach(function(sy,i){ w.appendChild(el("span","sy",sy+(i<parts.length-1?"・":""))); });
    d.appendChild(w);d.appendChild(document.createTextNode(" "));
  });
  return d;
}
function card(it){
  var c=el("div","card");
  var m=el("div","meta");m.appendChild(el("span","id",it.id));c.appendChild(m);
  c.appendChild(el("div","ja",it.ja));
  c.appendChild(el("div","myt my",it.my));
  c.appendChild(kanaEl(it.kn));
  var b=el("div","btns");
  var p=el("button","play","▶ 発音を聞く");
  p.onclick=function(){
    if(curCard===c){stopAudio();return}
    speak(it.my,c,it.id+" "+it.ja);
  };
  var s=el("button","star","★");s.setAttribute("aria-label","復習に入れる");
  s.setAttribute("aria-pressed",String(!!state.stars[it.id]));
  s.onclick=function(){
    if(state.stars[it.id])delete state.stars[it.id];else state.stars[it.id]=1;
    saveStars();s.setAttribute("aria-pressed",String(!!state.stars[it.id]));
    if(state.tab==="star")render();
  };
  b.appendChild(p);b.appendChild(s);c.appendChild(b);
  return c;
}
function render(){
  var L=$("#list");L.innerHTML="";var shown=0;
  DATA.forEach(function(sec,i){
    if(!sec.items.length)return;
    if(state.tab!=="all"&&state.tab!=="star"&&state.tab!==String(i))return;
    var items=sec.items.filter(matches);if(!items.length)return;
    var h=el("div","sec");h.appendChild(el("h2",null,sec.ja));
    var bar=el("div","secbar");
    if(sec.my){bar.appendChild(el("span","my",sec.my))}
    var all=el("button","mini","▶ この項目を順に再生");
    all.onclick=async function(){
      stopAudio();
      for(var k=0;k<items.length;k++){
        var cardEl=L.querySelectorAll(".card[data-id='"+CSS.escape(items[k].id)+"']")[0];
        var ok=await speak(items[k].my,cardEl,items[k].id+" "+items[k].ja);
        if(!ok)break;
        await new Promise(function(r){setTimeout(r,700)});
      }
    };
    bar.appendChild(all);h.appendChild(bar);
    if(sec.my&&sec.kn){var kk=kanaEl(sec.kn);kk.style.marginTop="6px";h.appendChild(kk)}
    L.appendChild(h);
    items.forEach(function(it){var c=card(it);c.setAttribute("data-id",it.id);L.appendChild(c);shown++});
  });
  if(!shown){L.appendChild(el("div","empty",state.tab==="star"?"★を付けた項目がありません。カードの★を押すとここに集まります。":"見つかりませんでした。"))}
}
$("#q").addEventListener("input",function(e){state.q=e.target.value;render()});
$("#stopAll").onclick=stopAudio;
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){}}
var showKana=true;try{showKana=localStorage.getItem("mm_kana")!=="0"}catch(e){}
function applyKana(){document.body.classList.toggle("nokana",!showKana);$("#kanaBtn").setAttribute("aria-pressed",String(showKana))}
$("#kanaBtn").onclick=function(){showKana=!showKana;try{localStorage.setItem("mm_kana",showKana?"1":"0")}catch(e){}applyKana()};
applyKana();
try{if(window.self!==window.top)$("#frameNote").style.display="block"}catch(e){$("#frameNote").style.display="block"}
buildTabs();render();
</script>
</body>
</html>
